name: Generate dependency lockfile

on:
  push:
    branches:
      - feature/automation-foundation

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/automation-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Regenerate package-lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --fund=false

      - name: Commit package-lock when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate dependency lockfile"
          git push origin HEAD:feature/automation-foundation
