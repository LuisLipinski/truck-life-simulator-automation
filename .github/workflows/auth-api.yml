name: Auth API Safe Regression

on:
  pull_request:
    branches:
      - development
    paths:
      - 'helpers/**'
      - 'tests/api/account/**'
      - 'tests/api/auth/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-api.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL to test
        required: true
        default: https://truck-life-simulator-api.onrender.com
        type: string
      confirm_invalid_login_attempt:
        description: Allow one real invalid login attempt against the selected environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: auth-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-auth:
    name: Safe auth and account checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://truck-life-simulator-api.onrender.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Type check
        run: npm run typecheck

      - name: Run safe auth regression
        run: npm run test:auth:safe

      - name: Upload safe auth report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auth-api-safe-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  invalid-login:
    name: One live invalid login attempt
    needs: safe-auth
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_invalid_login_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
      RUN_LOGIN_RATE_LIMITED_TESTS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Run one invalid login check
        run: npm run test:login:live-negative

      - name: Upload invalid login report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auth-api-invalid-login-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
